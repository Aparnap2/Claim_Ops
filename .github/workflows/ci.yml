# Layer A — fast deterministic CI. No services by construction: there is no
# `services:` block and no Postgres / Mockoon / localgcp steps in this file.
#
# This job is a thin wrapper around the repo's canonical gate chain
# (Makefile): `make pre-commit`, `make check`, `make race-test`,
# `make smoke-liteparse`. The same targets back the git hooks installed by
# `make hooks` and local runs — one gate definition, three surfaces. See
# docs/ci/VERIFICATION.md.
#
# Service-freedom holds because the suites self-skip by repo design:
# - Go integration-gated tests t.Skip when TEST_POSTGRES_DSN / Mockoon /
#   emulators are unreachable (see requirePool in
#   apps/api/internal/repository/postgres/postgres_test.go and the Makefile
#   header).
#
# The LiteParse live smoke is the exception and no longer self-skips here:
# `uv sync` runs BEFORE `make check`, so TestLiveShimSmoke inside
# `go test ./...` actually executes, and `make smoke-liteparse` re-runs it
# with CLAIMOPS_REQUIRE_LITEPARSE=1 so an absent or broken `liteparse` FAILS
# the job loudly. Before APA-48 the smoke ran before the Python setup and
# skipped on every run, which is how a worker image with no interpreter
# shipped green (see liveShim in
# apps/api/internal/parser/liteparse/live_test.go).
#
# Full parser benchmark (#31: Python + liteparse + 45 PDFs, ~1-2 min) is
# intentionally NOT run here. The smoke gate runs only the gated live smoke;
# full benchmark runs belong to a future eval workflow (#33 follow-up).

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: checkout + cache only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Matches the `go 1.27` directive in apps/api/go.mod (host: 1.27.1).
          go-version: '1.27'
          cache-dependency-path: apps/api/go.sum

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Matches the requires-python floor (>=3.12) in pyproject.toml.
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync Python env
        # `--group dev` mirrors `make setup`: pytest/ruff/mypy live in the
        # `dev` dependency-group in pyproject.toml. Synced BEFORE the gates so
        # TestLiveShimSmoke inside `make check`'s `go test ./...` executes
        # instead of skipping (APA-48).
        run: uv sync --group dev

      - name: make pre-commit (format-check + ruff + secret/credential guards)
        run: make pre-commit

      - name: Prove live-provider tests are build-tag isolated
        # Whole-tree structural guard: runs here on a clean checkout, not in
        # `make pre-commit`, which executes on developer working trees where
        # untracked scratch files would false-positive.
        run: python3 scripts/ci/check_qual_live_build_isolation.py

      - name: make check (format-check + lint + typecheck + unit tests)
        # Parser contract tests live under internal/parser/... and run as part
        # of `go test ./...` — no special step needed, just don't scope the
        # package list down to something that excludes them.
        run: make check

      - name: make race-test (concurrency-sensitive packages)
        # Scoped deliberately rather than `-race ./...` (APA-83 P8): the race
        # detector adds substantial runtime, so this covers the packages that
        # actually share mutable state. Package rationale lives in the
        # Makefile `race-test` target.
        run: make race-test

      # APA-48: as its own step AFTER `make check`, a missing or broken
      # parser runtime fails THIS job loudly instead of hiding behind an
      # unrelated package failure. The target bakes in
      # CLAIMOPS_REQUIRE_LITEPARSE=1.
      - name: make smoke-liteparse (live shim, fails if parser env is broken)
        run: make smoke-liteparse

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: make terraform-check (fmt -check + init -backend=false + validate)
        run: make terraform-check
