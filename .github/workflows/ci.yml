# Layer A — fast deterministic CI. No services by construction: there is no
# `services:` block and no Postgres / Mockoon / localgcp steps in this file.
#
# Service-freedom holds because the suites self-skip by repo design:
# - Go integration-gated tests t.Skip when TEST_POSTGRES_DSN / Mockoon /
#   emulators are unreachable (see requirePool in
#   apps/api/internal/repository/postgres/postgres_test.go and the Makefile
#   header: "integration-gated tests skip gracefully ... exit 0").
#
# The LiteParse live smoke is the exception and no longer self-skips here:
# it runs AFTER `uv sync`, with CLAIMOPS_REQUIRE_LITEPARSE=1, so an absent
# or broken `liteparse` FAILS the job. Before APA-48 it ran before the
# Python setup and skipped on every run, which is how a worker image with
# no interpreter shipped green (see liveShim in
# apps/api/internal/parser/liteparse/live_test.go).
#
# Full parser benchmark (#31: Python + liteparse + 45 PDFs, ~1-2 min) is
# intentionally NOT run here. The benchmark-smoke step runs only the gated
# live smoke; full benchmark runs belong to a future eval workflow
# (#33 follow-up).

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: checkout + cache only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Matches the `go 1.27` directive in apps/api/go.mod (host: 1.27.1).
          go-version: '1.27'
          cache-dependency-path: apps/api/go.sum

      - name: gofmt check
        working-directory: apps/api
        # Mirrors `make lint`'s gofmt gate (empty output = clean).
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then echo "gofmt: unformatted files:"; echo "$files"; exit 1; fi
          echo "gofmt: clean"

      - name: go vet
        working-directory: apps/api
        run: go vet ./...

      - name: Guard live-provider credentials out of PR workflows
        run: python3 scripts/ci/check_live_provider_workflow_secrets.py

      - name: Prove live-provider tests are build-tag isolated
        run: python3 scripts/ci/check_qual_live_build_isolation.py

      - name: go test (includes internal/parser/... contract tests)
        working-directory: apps/api
        # Parser contract tests live under internal/parser/... and run as part
        # of `go test ./...` — no special step needed, just don't scope the
        # package list down to something that excludes them.
        run: go test ./...

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Matches the requires-python floor (>=3.12) in pyproject.toml.
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Sync Python env
        # `--group dev` mirrors `make setup`: pytest/ruff/mypy live in the
        # `dev` dependency-group in pyproject.toml.
        run: uv sync --group dev

      # APA-48: this gate used to run BEFORE `Set up Python` / `uv sync`, so
      # liteparse was never importable and TestLiveShimSmoke SKIPPED on every
      # run — a permanently green pipeline while every ingested document
      # terminal-FAILED at parse in production. It now runs after the Python
      # environment exists, and CLAIMOPS_REQUIRE_LITEPARSE=1 makes a broken
      # parser environment a hard failure instead of a skip.
      #
      # Kept out of `go test ./...` on purpose: a skip-then-succeed interaction
      # there would hide the gate behind an unrelated package failure. As its
      # own step, a missing runtime fails THIS job loudly.
      - name: benchmark smoke (live shim, fails if parser env is broken)
        working-directory: apps/api
        # Gated smoke from #31: real shim + mapping + Validate path against
        # CASE-001, asserting pages, tables, bounding boxes, block IDs, block
        # types, parser metadata and reading-order evidence. This is the
        # smoke gate, not the fidelity benchmark.
        env:
          CLAIMOPS_REQUIRE_LITEPARSE: '1'
        run: go test ./internal/parser/liteparse/ -run TestLiveShimSmoke -count=1 -v

      - name: Python unit tests
        run: uv run pytest tests/unit -q

      - name: Ruff lint
        run: uv run ruff check .

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: infra/terraform
        run: terraform init -backend=false && terraform validate
