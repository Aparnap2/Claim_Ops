# Layer B — services-backed integration. Manual + push-gated: runs on pushes
# to main and on demand (workflow_dispatch), NOT on pull requests.
#
# Provenance of each step (proven vs placeholder vs gap):
# - PROVEN BY REPO DESIGN: `make integration` exits 0 with services absent —
#   postgres/mockoon-gated Go tests self-skip and the Makefile probes print
#   SKIP (see Makefile `integration` target).
# - ANTI-FAKE-GREEN: the assert-services step below fails the job when zero
#   postgres-backed tests ran, so a green check always proves the services
#   layer delivered (a 100%-skipped run = infra failure, not success).
# - PLACEHOLDER (TODO(ci-hardening)): the `start-mockoon` step below is
#   adapted from repo conventions but has NOT been executed under GitHub
#   Actions or act in this environment. The role-bootstrap + `db-bootstrap`
#   steps implement the production-shaped topology (owner claimops,
#   NOSUPERUSER app/worker — S1/APA-24) but likewise await the first green
#   run for confirmation; file a CI-hardening follow-up issue for any fix
#   needed.
# - DOCUMENTED GAP (not faked): localgcp is a host CLI (v0.6.0; Pub/Sub
#   :8085, Storage :4443; see `make local` and docs/gcp-compat-review.md)
#   with no pinned container image in repo config, so `make localgcp-test`
#   stays local-only. There is deliberately NO localgcp step here.

name: integration

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: checkout + cache only.
permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # Pinned; same image as the local claimops-postgres container.
        image: postgres:16-alpine
        env:
          # Service owner/superuser is `claimops`, mirroring the local
          # claimops-postgres container (POSTGRES_USER=claimops). Runtime
          # roles (claimops_app/claimops_worker) are provisioned below as
          # NOSUPERUSER so RLS (incl. FORCE) is actually enforced for tests.
          # Bootstrapping the service as claimops_app made it a superuser,
          # which bypasses RLS and red-then-green-inverted every
          # cross-tenant test (S1/APA-24). Never run tests as superuser.
          POSTGRES_USER: claimops
          # Throwaway CI-only password (matches the repo's local DSN
          # password, never a real secret). Production uses Secret Manager.
          POSTGRES_PASSWORD: claimops
          POSTGRES_DB: claimops
        ports:
          # Keeps the Makefile default DSN (localhost:5433) working unchanged.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U claimops -d claimops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Matches the `go 1.27` directive in apps/api/go.mod.
          go-version: '1.27'
          cache-dependency-path: apps/api/go.sum

      - name: Bootstrap service roles (pre-migration — mirrors local claimops-postgres)
        # Production-shaped role topology (S1/APA-24):
        # - `claimops` is the service bootstrap superuser AND migration
        #   owner (mirrors local claimops-postgres, POSTGRES_USER=claimops).
        #   002's `ALTER DEFAULT PRIVILEGES FOR ROLE claimops` requires this.
        # - `claimops_app` / `claimops_worker` are NOSUPERUSER LOGIN roles so
        #   RLS (incl. FORCE) is enforced for tests. A superuser app role
        #   bypasses RLS and inverts every cross-tenant test (red in CI,
        #   green locally) — that was the 10/10 Layer B failure mode.
        # Idempotent DO blocks (plain CREATE ROLE has no IF NOT EXISTS) plus
        # unconditional ALTER ROLE ... NOSUPERUSER (downgrades a pre-existing
        # superuser, e.g. reruns against a kept volume); versioned
        # migrations are never edited for environment shape.
        # Passwords are throwaway CI-only values matching the repo's local
        # DSNs (same convention as the postgres service above); production
        # uses Secret Manager / TF_VAR(db_password_*). They travel as env
        # references expanded by the runner shell (never echoed — logs show
        # the `$VAR` names only), the same exposure class as the existing
        # TEST_POSTGRES_DSN usage below. Values must stay single-quote-free.
        # NOTE: \$\$ is an escaped DO-block delimiter (an unescaped $$ would
        # expand to the shell PID inside the double-quoted SQL below).
        # NOTE: passwords are shell-expanded, not psql -v vars — psql
        # performs no variable substitution inside -c SQL strings.
        env:
          OWNER_DSN: postgres://claimops:claimops@localhost:5433/claimops
          CLAIMOPS_APP_PASSWORD: claimops_app
          CLAIMOPS_WORKER_PASSWORD: claimops_worker
        run: |
          BOOTSTRAP_SQL="DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'claimops_app') THEN
              CREATE ROLE claimops_app WITH NOSUPERUSER LOGIN PASSWORD '${CLAIMOPS_APP_PASSWORD}';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'claimops_worker') THEN
              CREATE ROLE claimops_worker WITH NOSUPERUSER LOGIN PASSWORD '${CLAIMOPS_WORKER_PASSWORD}';
            END IF;
          END
          \$\$;
          ALTER ROLE claimops_app WITH NOSUPERUSER LOGIN PASSWORD '${CLAIMOPS_APP_PASSWORD}';
          ALTER ROLE claimops_worker WITH NOSUPERUSER LOGIN PASSWORD '${CLAIMOPS_WORKER_PASSWORD}';"
          docker run --rm --network host \
            postgres:16-alpine \
            psql "$OWNER_DSN" -v ON_ERROR_STOP=1 -c "$BOOTSTRAP_SQL"

      - name: Bootstrap DB schema (migrations run as owner claimops)
        # Migrations run as the owner/superuser `claimops` — the same shape
        # as local (`psql` direct) and as production's migration path — so
        # GRANT/REVOKE/DEFAULT PRIVILEGES land identically. Tests run as
        # `claimops_app` (TEST_POSTGRES_DSN below), a non-superuser, so RLS
        # + privilege-denial assertions (postgres_test.go) execute against
        # the real enforced shape. If they fail, fix roles/grants here —
        # do NOT weaken the tests.
        # `--network host` assumes a Linux runner (GitHub ubuntu / act on
        # Linux); revisit if runners change OS.
        env:
          OWNER_DSN: postgres://claimops:claimops@localhost:5433/claimops
        run: |
          for f in infra/postgres/migrations/*.sql; do
            echo "applying $f"
            docker run --rm --network host \
              -v "${GITHUB_WORKSPACE}/infra/postgres/migrations:/migrations:ro" \
              postgres:16-alpine \
              psql "$OWNER_DSN" -v ON_ERROR_STOP=1 -f "/migrations/$(basename "$f")"
          done

      - name: Start Mockoon (PLACEHOLDER — verify on first run)
        # TODO(ci-hardening): confirm image/args on first green run, then pin
        # mockoon/cli to an immutable digest (the export's recorded port is
        # 3000 per mocks/mockoon/claims-systems.json; -p overrides it and
        # host :3001 matches the repo gate MOCKOON_URL=http://localhost:3001).
        # Proven 2026-09-12 against mockoon/cli:latest: the image entrypoint
        # already includes `start`, so the command is flags-only (`-d/-p`).
        # Passing `start` fails with "Unexpected argument: start".
        # Hardening: pre-remove any stale same-named container (local reruns
        # leave stopped containers holding the name) and run with --rm so a
        # failed job never leaves the named container behind.
        run: |
          docker rm -f claimops-mockoon >/dev/null 2>&1 || true
          docker run -d --rm --name claimops-mockoon -p 3001:3000 \
            -v "${GITHUB_WORKSPACE}/mocks/mockoon:/data:ro" \
            mockoon/cli:latest -d /data/claims-systems.json -p 3000

      - name: Probe Mockoon gate (informational — never fails)
        # Reports readiness of the exact URL the Go tests gate on
        # (Makefile `local` target). A missing Mockoon only causes
        # mockoon-gated tests to self-skip per repo design; it must not fail
        # this step, otherwise the step would fake-gate what `make
        # integration` already handles honestly.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/v1/policies/POL-001 >/dev/null 2>&1; then
              echo "mockoon: ready"
              break
            fi
            if [ "$i" = 30 ]; then
              echo "mockoon: NOT ready after 60s — mockoon-gated tests will self-skip (repo design)"
            fi
            sleep 2
          done

      - name: make integration (the gate)
        env:
          TEST_POSTGRES_DSN: postgres://claimops_app:claimops_app@localhost:5433/claimops
          MOCKOON_URL: http://localhost:3001
        run: make integration

      - name: Assert services actually ran tests (anti-fake-green)
        # Layer B's sole purpose is providing services. A 100%-skipped run
        # means infra failed, not "no services by design" — fail loudly so
        # a green check always proves PG-backed tests executed. Mockoon has
        # no equivalent gate (probe above is informational by design).
        env:
          TEST_POSTGRES_DSN: postgres://claimops_app:claimops_app@localhost:5433/claimops
        working-directory: apps/api
        run: |
          passes="$(go test ./internal/repository/postgres/ -v -count=1 2>&1 | grep -c '^--- PASS' || true)"
          echo "postgres-backed passing tests: $passes"
          if [ "$passes" -lt 1 ]; then
            echo "::error::zero postgres-backed tests ran — services layer failed (not a skip)"
            exit 1
          fi

      - name: Teardown Mockoon
        # Postgres service container is torn down automatically by the runner.
        if: always()
        run: docker rm -f claimops-mockoon >/dev/null 2>&1 || true
