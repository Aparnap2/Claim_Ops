[project]
name = "claimops-ai"
version = "0.1.0"
description = "ClaimOps AI — governed health-insurance reimbursement intake + exception investigation (deterministic core first, zero LLM in Phase 1)"
requires-python = ">=3.12"
dependencies = [
  "pillow>=12.3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "pypdf>=6.18.0",
  "pyyaml>=6.0.3",
  "reportlab>=5.0.1",
  "structlog>=24.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-reportlab>=4.5.1.20260827",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
show_error_codes = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]
